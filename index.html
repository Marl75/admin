<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Suivi d'utilisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0e13; --surface: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.08);
    --text: #f4f2ed; --dim: #a09bb0; --faint: #6b6678; --accent: #c9a961; --accent-soft: rgba(201, 169, 97, 0.15);
    --green: #6dbfa8; --blue: #6a9bd4; --red: #e07a6c;
  }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 32px 20px 60px; line-height: 1.5; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; letter-spacing: -1px; color: #e3cf9f; }
  .sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  button, .btn { font-family: inherit; font-size: 14px; border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--dim); }
  button.primary { background: var(--accent); color: #1a1426; border: none; font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .login { max-width: 380px; margin: 60px auto; display: flex; flex-direction: column; gap: 12px; }
  .login label { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .login input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; margin-top: 6px; }
  .error { color: var(--red); font-size: 14px; }
  .note { color: var(--faint); font-size: 13px; }
  .months { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .months button { padding: 7px 12px; border-radius: 999px; font-size: 13px; }
  .months button.on { background: var(--accent-soft); border-color: var(--accent); color: #e3cf9f; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi .v { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 600; }
  .kpi .l { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .section { margin-top: 26px; }
  .section h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; margin-bottom: 12px; }
  .chart { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; align-items: end; height: 190px; }
  .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; cursor: pointer; }
  .bars { display: flex; gap: 3px; align-items: flex-end; height: 140px; width: 100%; justify-content: center; }
  .bar { width: 42%; max-width: 18px; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bar.users { background: var(--accent); }
  .bar.created { background: var(--green); }
  .col .n { font-size: 11px; color: var(--dim); }
  .col .m { font-size: 11px; color: var(--faint); }
  .col.on .m { color: var(--text); font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--dim); margin-top: 10px; }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .legend .u::before { background: var(--accent); }
  .legend .c::before { background: var(--green); }
  .stack { display: flex; flex-direction: column-reverse; gap: 2px; width: 60%; max-width: 26px; min-height: 2px; }
  .stack .seg { border-radius: 0; min-height: 2px; }
  .stack .seg:last-child { border-radius: 4px 4px 0 0; }
  .stack .seg:hover { filter: brightness(1.25); }
  .legend .who::before { background: var(--c); }
  .kpi.ai .v { color: #a9c6ec; }
  td.num { white-space: nowrap; }
  td:first-child { white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  pre { background: #07060a; border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 12px; overflow-x: auto; color: #e3cf9f; margin: 12px 0; white-space: pre; }
  code { color: #e3cf9f; }
  ol { margin: 10px 0 0 20px; color: var(--dim); font-size: 14px; }
  ol li { margin-bottom: 6px; }

  /* Onglets : une appli par onglet */
  .tabs { display: flex; gap: 6px; margin-bottom: 22px; border-bottom: 1px solid var(--border); }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--dim); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .state { font-size: 11px; color: var(--faint); margin-left: 6px; font-weight: 500; }
  .bar.days { background: var(--blue); }
  .legend .d::before { background: var(--blue); }
  .bar.blocked { background: var(--red); }
  .legend .b::before { background: var(--red); }
  .legend .l::before { background: none; border-top: 2px dashed var(--red); height: 0; border-radius: 0; vertical-align: 3px; }
  .chart.days30 { grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; position: relative; }
  .chart.days30 .bar { width: 45%; }
  .chart.days30 .m { font-size: 10px; }
  .chart.days30 .n { min-height: 16px; }
  @media (max-width: 600px) {
    .chart.days30 .n { font-size: 0; }
    .chart.days30 .col:not(:nth-child(5n)):not(:last-of-type) .m { visibility: hidden; }
  }
  .chart.days30 .bars { position: relative; }
  .limit-line { position: absolute; left: -2px; right: -2px; margin-bottom: -2px; border-top: 2px dashed var(--red); opacity: .6; pointer-events: none; }
  .gauge { height: 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
  .gauge span { display: block; height: 100%; border-radius: 6px; }
  tfoot td { border-bottom: none; color: var(--dim); }

  /* Lecture des chiffres : variations, indicateurs secondaires, mois en cours, exploitation repliée */
  .kpi .delta { font-size: 12px; color: var(--faint); margin-top: 4px; }
  .kpi .delta.up { color: var(--green); }
  .kpi .delta.down { color: var(--red); }
  .secondary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--dim); margin: -8px 0 10px; }
  .secondary strong { color: var(--text); font-weight: 600; }
  .partial-note { margin-bottom: 4px; }
  .charts2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 16px; }
  .col.partial .bar { opacity: .55; background-image: repeating-linear-gradient(45deg, rgba(15, 14, 19, .5) 0 3px, transparent 3px 6px); }
  .col.partial .m::after { content: '*'; }
  .me { font-size: 13px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  /* Tableaux du détail du Site : mêmes largeurs de colonnes d'un tableau à l'autre */
  table.aligned { table-layout: fixed; }
  table.aligned col.num { width: 22%; }
  table.aligned td:first-child { white-space: normal; }
  details.ops { margin-top: 26px; }
  details.ops > summary { cursor: pointer; list-style: none; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; }
  details.ops > summary::-webkit-details-marker { display: none; }
  details.ops > summary h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  details.ops > summary h2::before { content: '▸ '; }
  details.ops[open] > summary h2::before { content: '▾ '; }
  details.ops .alert { color: #c98500; font-size: 14px; margin-top: 6px; }
  details.ops > summary .note { margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="note">Chargement…</p></div>

<script>
// ===== SUIVI D'UTILISATION DE TOUTES LES APPLIS =====
// Une seule page, un onglet par appli. Chaque appli a son propre projet Firebase : la page se
// connecte aux deux avec le même e-mail et mot de passe. Les statistiques ne sont lisibles que
// par l'administratrice, grâce aux règles Firestore de chaque projet (affichées ici si besoin).
const APPS = {
  collection: {
    name: 'Collection', url: 'https://marl75.github.io/mes-livres/',
    config: {
      apiKey: "AIzaSyDj2AnlTDxOv_sHD311icF540ijNPMJS2E",
      authDomain: "mes-livres-dafce.firebaseapp.com",
      projectId: "mes-livres-dafce",
      storageBucket: "mes-livres-dafce.firebasestorage.app",
      messagingSenderId: "832888789850",
      appId: "1:832888789850:web:82352a1b18640f89aab163",
    },
  },
  routine: {
    name: 'Routine', url: 'https://marl75.github.io/fitness-coach/',
    config: {
      apiKey: "AIzaSyAvxvKu02zr-8MCS21_gvDYuF_LqNnzjTM",
      authDomain: "fitcoach-71392.firebaseapp.com",
      projectId: "fitcoach-71392",
      storageBucket: "fitcoach-71392.firebasestorage.app",
      messagingSenderId: "756601608124",
      appId: "1:756601608124:web:923dd8a7370a12d2203db9",
    },
  },
};
for (const [key, a] of Object.entries(APPS)) {
  a.fb = firebase.initializeApp(a.config, key);
  a.auth = a.fb.auth();
  a.db = a.fb.firestore();
  a.user = undefined; // inconnu tant que Firebase n'a pas répondu
  a.docs = null; a.error = null;
}
const root = document.getElementById('root');
let tab = 'collection';
const isTab = k => k in APPS || k === 'site';
try { tab = localStorage.getItem('admin-tab') || (isTab(location.hash.slice(1)) ? location.hash.slice(1) : 'collection'); } catch (e) {}
if (!isTab(tab)) tab = 'collection';
let selected = null;
let docs = []; // statistiques de l'onglet affiché (utilisées par les fonctions de Collection)

// Les documents usage sont écrits par les comptes eux-mêmes : on ne garde que des nombres, plus l'e-mail
// et la langue (échappés à l'affichage), pour qu'aucun texte ne se glisse dans les tableaux.
function cleanUsage(v, key) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
  if (typeof v === 'string') return key === 'email' || key === 'lang' ? v : undefined;
  if (v && typeof v === 'object' && !Array.isArray(v)) {
    const o = {};
    for (const [k, x] of Object.entries(v)) { const c = cleanUsage(x, k); if (c !== undefined) o[k] = c; }
    return o;
  }
  return undefined;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthLabel = (m, style) => new Date(+m.slice(0, 4), +m.slice(5) - 1, 1).toLocaleDateString('fr-FR', { month: style || 'short', year: style ? 'numeric' : undefined }).replace('.', '');
const dateLabel = ts => ts ? new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }) : '–';

// ----- Lecture des chiffres : ton compte, mois en cours, variations -----
// Ton propre compte (le même uid que celui connecté à cette page) est exclu par défaut pour ne pas
// gonfler les chiffres ; l'interrupteur en haut des onglets Collection et Routine le réintègre.
let includeMe = false;
try { includeMe = localStorage.getItem('admin-include-me') === '1'; } catch (e) {}
const withoutMe = a => includeMe ? a.docs : a.docs.filter(u => u.id !== a.user.uid);
const meToggle = () => `<label class="me"><input type="checkbox" ${includeMe ? 'checked' : ''} onchange="Admin.toggleMe(this.checked)"> Inclure mon compte</label>`;
const accountsLabel = n => `${n} compte${n > 1 ? 's' : ''} connu${n > 1 ? 's' : ''}${includeMe ? '' : ' (sans le tien)'}`;
// Mois en cours : seuls les jours écoulés comptent, d'où la mention sous les chiffres et la barre hachurée
const isCurrent = m => m === monthKey(new Date());
const prevMonthKey = m => monthKey(new Date(+m.slice(0, 4), +m.slice(5) - 2, 1));
function partialNote(m, sameDays) {
  if (!isCurrent(m)) return '';
  const d = new Date(), n = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const prev = monthLabel(prevMonthKey(m), 'long');
  return `<p class="note partial-note">${monthLabel(m, 'long')} est en cours (${d.getDate()} jours sur ${n}) : ${sameDays
    ? `les variations le comparent aux ${d.getDate()} premiers jours de ${prev}.`
    : `les variations le comparent à ${prev} entier, attends la fin du mois pour conclure.`}</p>`;
}
// Écart avec le mois précédent, sous le chiffre ; neutral : pas de vert ni de rouge (un coût qui monte n'est ni bien ni mal)
function deltaHtml(cur, prev, m, fmt = n => n, neutral = false) {
  if (prev == null) return '';
  const d = cur - prev;
  const cls = neutral || !d ? '' : d > 0 ? 'up' : 'down';
  return `<div class="delta ${cls}">${d ? (d > 0 ? '+' : '−') + fmt(Math.abs(d)) : '='} vs ${monthLabel(prevMonthKey(m))}</div>`;
}
const kpiCard = (v, label, delta = '', cls = '') => `<div class="card kpi ${cls}"><div class="v">${v}</div><div class="l">${label}</div>${delta}</div>`;
// Indicateurs secondaires : une ligne discrète sous les chiffres clés
const secondary = items => `<p class="secondary">${items.map(([v, l]) => `<span><strong>${v}</strong> ${l}</span>`).join('')}</p>`;
// Un graphique par série, chacun à sa propre échelle (deux séries côte à côte trompaient l'œil)
function monthChart(title, perMonth, key, cls, fmt = n => n) {
  const max = Math.max(...perMonth.map(p => p[key] || 0)) || 1;
  return `<div class="section card">
      <h2>${title} · 12 derniers mois</h2>
      <div class="chart">${perMonth.map(p => `
        <div class="col ${p.m === selected ? 'on' : ''} ${isCurrent(p.m) ? 'partial' : ''}" onclick="Admin.pick('${p.m}')" title="${monthLabel(p.m, 'long')}${isCurrent(p.m) ? ' (en cours)' : ''} : ${fmt(p[key] || 0)}">
          <div class="bars"><span class="bar ${cls}" style="height:${(p[key] || 0) / max * 100}%"></span></div>
          <span class="n">${p[key] ? fmt(p[key]) : ''}</span>
          <span class="m">${monthLabel(p.m)}</span>
        </div>`).join('')}</div>
    </div>`;
}
const topButtons = extra => `<div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">${extra || ''}<button onclick="Admin.reload()">Actualiser</button><button onclick="Admin.signOut()">Se déconnecter</button></div>`;

// ----- Collection : calculs repris à l'identique de l'ancienne page admin -----
const usd = n => n ? `${n < 0.995 ? n.toFixed(3) : n.toFixed(2)} $` : '0 $';
const dateTimeLabel = ts => ts ? new Date(ts).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';

function totalRecoCost() {
  return docs.reduce((n, u) => n + Object.values(u.months || {}).reduce((m, x) => m + (x.recoCost || 0), 0), 0);
}

// Couleurs des utilisateurs dans le graphique des coûts (palette catégorielle validée pour
// fond sombre, dans un ordre fixe). Au-delà de 7 comptes, les autres sont regroupés.
const USER_COLORS = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9'];
const OTHERS_COLOR = '#6b6678';

// Comptes classés par coût total sur la période : la couleur suit le compte, pas le mois
function recoColors(perMonth) {
  const totals = {};
  perMonth.forEach(p => p.rows.forEach(r => { if (r.recoCost) totals[r.email] = (totals[r.email] || 0) + r.recoCost; }));
  const ranked = Object.keys(totals).sort((a, b) => totals[b] - totals[a] || a.localeCompare(b));
  const colors = {};
  ranked.forEach((email, i) => { colors[email] = USER_COLORS[i] || OTHERS_COLOR; });
  return { colors, ranked, totals };
}

function costStack(p, colors, ranked, maxCost) {
  const segs = {};
  p.rows.forEach(r => {
    if (!r.recoCost) return;
    const key = colors[r.email] === OTHERS_COLOR ? 'Autres comptes' : r.email;
    segs[key] = (segs[key] || 0) + r.recoCost;
  });
  const order = [...ranked.filter(e => segs[e]), ...(segs['Autres comptes'] ? ['Autres comptes'] : [])];
  if (!order.length) return '<div class="stack"></div>';
  return `<div class="stack" style="height:${p.recoCost / maxCost * 100}%">${order.map(k => `
    <span class="seg" style="flex:${(segs[k] / p.recoCost * 100).toFixed(2)} 1 0; background:${colors[k] || OTHERS_COLOR}" title="${esc(monthLabel(p.m, 'long'))} · ${esc(k)} : ${usd(segs[k])}"></span>`).join('')}</div>`;
}

// ----- Collection : recommandations jour par jour (documents recoDaily/{AAAA-MM-JJ}) -----
// Écrits par la fonction serveur : compteur global du jour, blocages, coût et détail par compte.
const parisDay = d => new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris' }).format(d || new Date());
const dayLabel = (day, style) => new Date(day + 'T12:00:00').toLocaleDateString('fr-FR', style === 'long' ? { weekday: 'long', day: 'numeric', month: 'long' } : { day: 'numeric', month: 'short' }).replace('.', '');
let selectedDay = null;

// Demandes avec un jeton App Check valide sur le total des demandes reçues (« – » avant la mise en place)
function appCheckLabel(x) {
  const ok = x.appCheckOk || 0, total = ok + (x.appCheckMissing || 0);
  return total ? `${ok} / ${total}` : '–';
}

function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(parisDay(new Date(Date.now() - i * 86400000)));
  return [...new Set(out)];
}

function dailySection(daily, error) {
  if (error === 'rules') return `
    <div class="section card">
      <h2>Recommandations · suivi quotidien</h2>
      <p class="note">Le suivi jour par jour n'est pas encore lisible : les règles Firestore doivent autoriser <code>recoDaily</code>. Remplace les règles du projet par celles-ci (ton identifiant est déjà dedans), puis clique sur Actualiser.</p>
      <pre>${esc(rulesFor('collection', APPS.collection.user.uid))}</pre>
      <button class="primary" onclick="Admin.copyRules('collection', this)">Copier les règles</button>
    </div>`;
  if (error) return `<div class="section card"><h2>Recommandations · suivi quotidien</h2><p class="error">Impossible de charger le suivi quotidien : ${esc(error)}</p></div>`;
  if (!daily) return `<div class="section card"><h2>Recommandations · suivi quotidien</h2><p class="note">Chargement…</p></div>`;

  const byDay = Object.fromEntries(daily.map(d => [d.id, d]));
  const days = lastDays(30);
  const today = days[days.length - 1];
  if (!selectedDay || !days.includes(selectedDay)) selectedDay = today;
  const t = byDay[today] || {};
  const limits = t.limits || daily.reduce((l, d) => d.limits || l, null) || { user: 5, global: 30 };
  const used = t.count || 0;
  const pct = Math.min(100, used / limits.global * 100);
  const max = Math.max(limits.global, ...days.map(d => (byDay[d] || {}).count || 0));
  const emails = Object.fromEntries((APPS.collection.docs || docs).map(u => [u.id, u.email || u.id]));
  const sel = byDay[selectedDay] || {};
  const rows = Object.entries(sel.users || {}).map(([uid, u]) => ({ uid, email: emails[uid] || uid, ...u }))
    .sort((a, b) => (b.count || 0) - (a.count || 0) || (b.blocked || 0) - (a.blocked || 0));
  const month = days.filter(d => d.slice(0, 7) === today.slice(0, 7));
  const sum = (list, k) => list.reduce((n, d) => n + ((byDay[d] || {})[k] || 0), 0);

  return `
    <div class="section card">
      <h2>Recommandations · aujourd'hui (${esc(dayLabel(today, 'long'))})</h2>
      <div class="kpis" style="margin-bottom:14px;">
        <div class="card kpi ai"><div class="v">${used} / ${limits.global}</div><div class="l">Demandes du jour (tous comptes)</div></div>
        <div class="card kpi"><div class="v">${Object.values(t.users || {}).filter(u => u.count).length}</div><div class="l">Comptes ayant demandé</div></div>
        <div class="card kpi"><div class="v">${t.blockedUser || 0}</div><div class="l">Bloquées (limite de ${limits.user} par compte)</div></div>
        <div class="card kpi"><div class="v" style="${t.blockedGlobal ? 'color:var(--red)' : ''}">${t.blockedGlobal || 0}</div><div class="l">Bloquées (plafond global)</div></div>
        <div class="card kpi"><div class="v">${t.failed || 0}</div><div class="l">Échecs</div></div>
        <div class="card kpi ai"><div class="v">${usd(t.cost || 0)}</div><div class="l">Coût du jour</div></div>

// Points à surveiller dans l'exploitation : la section repliée s'ouvre d'elle-même s'il y en a
function opsAlerts(a) {
  if (a.dailyError) return ['suivi quotidien illisible'];
  const t = (a.daily || []).find(d => d.id === parisDay()) || {};
  const limits = t.limits || { user: 5, global: 30 };
  const out = [];
  if ((t.count || 0) >= limits.global * 0.8) out.push(`${t.count} demandes sur ${limits.global} aujourd'hui`);
  if (t.blockedGlobal) out.push(`${t.blockedGlobal} bloquée(s) par le plafond global`);
  if (t.failed) out.push(`${t.failed} échec(s) aujourd'hui`);
  if (t.appCheckMissing) out.push(`${t.appCheckMissing} demande(s) sans App Check aujourd'hui`);
  const full = (a.docs || []).filter(u => (u.docBytes || 0) >= 0.8 * 1024 * 1024).length;
  if (full) out.push(`${full} compte(s) à plus de 80 % de la limite de 1 Mo`);
  return out;
}
function opsSection(a) {
  const alerts = opsAlerts(a);
  return `<details class="ops" ${alerts.length ? 'open' : ''}>
      <summary><h2>Exploitation IA · plafonds, coût du jour, App Check</h2>${alerts.length
        ? `<p class="alert">À surveiller : ${esc(alerts.join(' · '))}</p>`
        : `<p class="note">Rien à signaler aujourd'hui. Chiffres réels, ton compte compris.</p>`}</summary>
      ${dailySection(a.daily, a.dailyError)}
    </details>`;
}

const rate = (n, of) => of ? `${Math.round(n / of * 100)} %` : '–';

    .sort((a, b) => b.recoCost - a.recoCost || b.reco - a.reco);

function lastMonths(n) {
  const out = [];
  const d = new Date();
  d.setDate(1);
  for (let i = 0; i < n; i++) { out.unshift(monthKey(d)); d.setMonth(d.getMonth() - 1); }
  return out;
}

function monthStats(m) {
  const rows = docs.map(u => {
    const mm = (u.months || {})[m] || {};
    return {
      email: u.email || u.id,
      sessions: mm.sessions || 0,
      created: (u.createdByMonth || {})[m] || 0,
      modified: mm.modified || 0,
      deleted: mm.deleted || 0,
      lastSeen: mm.lastSeen || 0,
      reco: mm.reco || 0,
      recoFailed: mm.recoFailed || 0,
      recoBlocked: mm.recoBlocked || 0,
      recoBlockedGlobal: mm.recoBlockedGlobal || 0,
      recoAdded: mm.recoAdded || 0,
      recoDismissed: mm.recoDismissed || 0,
      recoTokens: (mm.recoTokensIn || 0) + (mm.recoTokensOut || 0),
      recoCost: mm.recoCost || 0,
      recoLastAt: mm.recoLastAt || 0,
      typesChosen: mm.typesChosen || 0,
      typesSkipped: mm.typesSkipped || 0,
    };
  }).filter(r => r.sessions || r.created || r.modified || r.deleted || r.reco || r.recoFailed || r.recoBlocked || r.recoBlockedGlobal);
  const sum = k => rows.reduce((n, r) => n + r[k], 0);
  return {
    rows: rows.sort((a, b) => b.sessions - a.sessions || b.created - a.created),
    // Actif : au moins une action enregistrée dans le mois (ouverture, ajout, modification, recos), comme pour Routine
    active: rows.length,
    sessions: sum('sessions'), created: sum('created'), modified: sum('modified'), deleted: sum('deleted'),
    reco: sum('reco'), recoFailed: sum('recoFailed'), recoBlocked: sum('recoBlocked'), recoAdded: sum('recoAdded'),
    recoDismissed: sum('recoDismissed'), recoCost: sum('recoCost'),
    recoUsers: rows.filter(r => r.reco || r.recoFailed || r.recoBlocked || r.recoBlockedGlobal).length,
    typesChosen: sum('typesChosen'), typesSkipped: sum('typesSkipped'),
  };
}

const TYPE_NAMES = { livre: 'Livres', film: 'Films', serie: 'Séries', jeu: 'Jeux' };

  return Object.keys(TYPE_NAMES).filter(ty => (u.types || {})[ty] > 0);

  if (!u.types) return '–';
  const shown = shownTypes(u);
  return shown.length === Object.keys(TYPE_NAMES).length ? 'Toutes' : shown.map(ty => TYPE_NAMES[ty]).join(', ');
}

// Place occupée par une collection sur le maximum de 1 Mo par compte, en rouge à partir de 80 %
function sizeLabel(bytes) {
  if (!bytes) return '–';
  const pct = Math.round(bytes / (1024 * 1024) * 100);
  return pct >= 80 ? `<span class="error">${pct} %</span>` : `${pct} %`;
}

// ----- Règles à coller dans la console Firebase quand l'accès n'est pas encore autorisé -----
function rulesFor(key, uid) {
  if (key === 'collection') return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }

      function validShare(d) {
        return d.keys().hasOnly(['owner', 'name', 'items', 'config', 'updatedAt'])
          && d.owner == request.auth.uid
          && d.name is string && d.name.size() <= 200
          && d.items is list && d.items.size() <= 2000
          && d.config is map
          && d.config.keys().hasOnly(['cats', 'types', 'notes', 'avis'])
          && d.config.cats is list
          && d.config.cats.hasOnly(['lu', 'en-cours', 'a-lire', 'abandonne', 'wishlist'])
          && d.config.types is list
          && d.config.types.hasOnly(['livre', 'film', 'serie', 'jeu'])
          && d.config.notes is bool && d.config.avis is bool;
      }
      allow get: if true;
      allow create: if request.auth != null && validShare(request.resource.data);
      allow update: if request.auth != null && resource.data.owner == request.auth.uid
                    && validShare(request.resource.data);
      allow delete: if request.auth != null && resource.data.owner == request.auth.uid;
    }
    match /usage/{userId} {
      function ym(t) {
        return string(t.year()) + '-' + (t.month() < 10 ? '0' : '') + string(t.month());
      }
      function step(after, before, f) {
        return after.get(f, 0) is int
            && (after.get(f, 0) == before.get(f, 0) || after.get(f, 0) == before.get(f, 0) + 1);
      }
      function validMonth(after, before) {
        return after.diff(before).affectedKeys()
                 .hasOnly(['sessions', 'modified', 'deleted', 'recoAdded', 'recoDismissed',
                           'typesChosen', 'typesSkipped', 'lastSeen'])
            && step(after, before, 'sessions') && step(after, before, 'modified')
            && step(after, before, 'deleted') && step(after, before, 'recoAdded')
            && step(after, before, 'recoDismissed') && step(after, before, 'typesChosen')
            && step(after, before, 'typesSkipped');
      }
      function validUsage(after, before) {
        let changed = after.diff(before).affectedKeys();
        let months = after.get('months', {});
        let old = before.get('months', {});
        let m1 = ym(request.time - duration.value(14, 'h'));
        let m2 = ym(request.time + duration.value(14, 'h'));
        let changedMonths = months.diff(old).affectedKeys();
        return changed.hasOnly(['email', 'firstSeen', 'lastSeen', 'createdByMonth', 'itemCount',
                                'profileCount', 'docBytes', 'types', 'typesCustom', 'months'])
            && (!('email' in changed) || after.email == request.auth.token.get('email', ''))
            && (!('firstSeen' in changed) || !('firstSeen' in before))
            && changedMonths.hasOnly([m1, m2]) && changedMonths.size() <= 1
            && validMonth(months.get(m1, {}), old.get(m1, {}))
            && validMonth(months.get(m2, {}), old.get(m2, {}));
      }
      allow read: if request.auth != null
                  && (request.auth.uid == userId || request.auth.uid == '${uid}');
      allow create: if request.auth != null && request.auth.uid == userId
                    && validUsage(request.resource.data, {});
      allow update: if request.auth != null && request.auth.uid == userId
                    && validUsage(request.resource.data, resource.data);
    }
    match /recoDaily/{day} {
      allow read: if request.auth != null && request.auth.uid == '${uid}';
    }
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;
  // Mêmes règles que firestore.rules du dépôt fitness-coach (avec ton identifiant)
  return `rules_version = '2';
// Règles de sécurité de Routine (projet « fitcoach-71392 »).
// Ce fichier est une référence : les règles actives se règlent dans la console Firebase
// (Firestore Database > Règles), ou avec « firebase deploy --only firestore:rules ».
// La page de suivi (marl75.github.io/admin) affiche ce texte avec le bon identifiant
// à la place de ADMIN_UID. Tests : node tests/rules.cjs (voir le fichier).
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn(uid) {
      return request.auth != null && request.auth.uid == uid;
    }

    // Chaque compte ne lit et n'écrit que ses propres séances, exercices et réglages,
    // et seulement dans ces trois collections, avec des tailles raisonnables.
    match /users/{uid} {
      // Séances : une par jour, identifiant AAAA-MM-JJ
      match /sessions/{day} {
        allow read, delete: if signedIn(uid);
        allow create, update: if signedIn(uid)
          && day.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}$')
          && request.resource.data.entries is list
          && request.resource.data.entries.size() <= 100;
      }
      // Exercices créés
      match /exercises/{exId} {

        allow create, update: if signedIn(uid)
          && exId.size() <= 100
          && request.resource.data.name is string
          && request.resource.data.name.size() <= 100;
      }
      // Réglages : un seul document « prefs »
      match /settings/{docId} {

        allow create, update: if signedIn(uid) && docId == 'prefs';
      }
    }

    // Statistiques d'utilisation (js/usage.js) : chaque compte écrit les siennes, dans un format
    // contrôlé (la page de suivi les affiche) ; seule l'administratrice peut toutes les lire.
    match /usage/{uid} {
      // Mois au format AAAA-MM, comme usageMonth() dans usage.js
      function ym(t) {
        return string(t.year()) + '-' + (t.month() < 10 ? '0' : '') + string(t.month());
      }
      function count(d, f) {
        return !(f in d) || (d[f] is int && d[f] >= 0 && d[f] <= 100000);
      }
      // Compteurs du mois : +1 au plus à chaque écriture
      function step(after, before, f) {
        return after.get(f, 0) is int
            && (after.get(f, 0) == before.get(f, 0) || after.get(f, 0) == before.get(f, 0) + 1);
      }
      function validMonth(after, before) {
        return after.diff(before).affectedKeys().hasOnly(['opens', 'routines', 'lastSeen'])
            && step(after, before, 'opens') && step(after, before, 'routines')
            && (!('lastSeen' in after) || after.lastSeen is int);
      }
      function validUsage(after, before) {
        let changed = after.diff(before).affectedKeys();
        let months = after.get('months', {});
        let old = before.get('months', {});
        // Mois en cours : celui de l'appareil peut différer du mois UTC près d'un changement de mois
        let m1 = ym(request.time - duration.value(14, 'h'));
        let m2 = ym(request.time + duration.value(14, 'h'));
        let changedMonths = months.diff(old).affectedKeys();
        return changed.hasOnly(['email', 'firstSeen', 'lastSeen', 'activityByMonth', 'sessionCount',
                                'routineCount', 'customCount', 'goalsCount', 'lang', 'months'])
            && (!('email' in changed) || after.email == request.auth.token.get('email', ''))
            && (!('firstSeen' in changed) || (!('firstSeen' in before) && after.firstSeen is int))
            && (!('lastSeen' in changed) || after.lastSeen is int)
            && (!('activityByMonth' in changed) || (after.activityByMonth is map && after.activityByMonth.size() <= 240))
            && count(after, 'sessionCount') && count(after, 'routineCount')
            && count(after, 'customCount') && count(after, 'goalsCount')
            && (!('lang' in changed) || after.lang in ['fr', 'en'])
            && months is map
            && changedMonths.hasOnly([m1, m2]) && changedMonths.size() <= 1
            && validMonth(months.get(m1, {}), old.get(m1, {}))
            && validMonth(months.get(m2, {}), old.get(m2, {}));
      }
      allow read: if request.auth != null && (request.auth.uid == uid || request.auth.uid == '${uid}');
      allow create: if signedIn(uid) && validUsage(request.resource.data, {});
      allow update: if signedIn(uid) && validUsage(request.resource.data, resource.data);
    }

    // Tout le reste est interdit
    match /{document=**} {
      allow read, write: if false;
    }
  }
}`;
}

// Le compteur public (réglage « Allow adding visitor counts on your website ») ne demande aucune clé,
// donc rien de secret dans cette page. Il ne donne que des totaux, mis en cache jusqu'à 4 h ;
// les provenances (LinkedIn, Google…) se lisent dans le tableau de bord GoatCounter.
const SITE = {
  name: 'Site', url: 'https://marlenemenoire.com/', code: 'marlenemenoire',

  routineClicks: [['routine-clic-demo', 'Essayer sans compte'], ['routine-clic-creer-compte', 'Créer un compte'], ['routine-clic-connexion', 'Se connecter']],
  linkedin: 'clic-linkedin',
  totals: null, detail: {}, prevToDate: null, error: null, loading: false,
};
const siteDash = () => `https://${SITE.code}.goatcounter.com`;
// Visiteurs d'une page (ou TOTAL pour tout le site) sur un mois, ou sur ses `day` premiers jours ;
// 0 si la page n'a encore aucune visite
async function siteCount(path, m, day) {
  const start = `${m}-01`;
  const last = new Date(+m.slice(0, 4), +m.slice(5), 0).getDate();
  const end = day ? `${m}-${String(Math.min(day, last)).padStart(2, '0')}`
    : m === monthKey(new Date()) ? parisDay() : `${m}-${String(last).padStart(2, '0')}`;
  const res = await fetch(`${siteDash()}/counter/${encodeURIComponent(path)}.json?start=${start}&end=${end}`);
  if (res.status === 404) return 0;
  if (!res.ok) throw new Error(res.status === 403 || res.status === 400
    ? 'compteur public désactivé ou site GoatCounter introuvable' : `erreur ${res.status}`);
  return +String((await res.json()).count).replace(/\D/g, '') || 0;
}
async function loadSite() {
  if (SITE.loading) return;
  SITE.loading = true;
  try {
    if (!SITE.totals) {
      const months = lastMonths(12);
      const counts = await Promise.all(months.map(m => siteCount('TOTAL', m)));
      SITE.totals = Object.fromEntries(months.map((m, i) => [m, counts[i]]));
    }
    const m = selected || lastMonths(1)[0];
    // Mois en cours : le mois précédent sur les mêmes jours, pour une comparaison juste
    if (SITE.prevToDate == null) SITE.prevToDate = await siteCount('TOTAL', prevMonthKey(monthKey(new Date())), new Date().getDate());
    if (!SITE.detail[m]) {
      const keys = [...SITE.pages, ...SITE.clicks, ...SITE.routineClicks].map(([p]) => p).concat(SITE.linkedin);
      const frKeys = SITE.pages.map(([p]) => '/fr' + p);
      const counts = await Promise.all([...keys, ...frKeys].map(p => siteCount(p, m)));
      SITE.detail[m] = Object.fromEntries(keys.map((p, i) => [p, counts[i]]));
      frKeys.forEach((p, i) => { SITE.detail[m][SITE.pages[i][0]] += counts[keys.length + i]; });
    }
    SITE.error = null;
  } catch (e) {
    // Une adresse inconnue ou un compteur désactivé répond sans autorisation CORS : fetch échoue sans détail
    SITE.error = e instanceof TypeError ? 'site GoatCounter introuvable ou compteur public désactivé' : e.message;
  }
  SITE.loading = false;
  if (tab === 'site') draw();
}

async function load(key) {
  const a = APPS[key];
  if (!a.user) return;
  try {
    const snap = await a.db.collection('usage').get();
    a.docs = snap.docs.map(d => ({ ...cleanUsage(d.data()), id: d.id }));
    a.error = null;
    if (key === 'collection') {
      try {
        const start = lastDays(30)[0];
        const daily = await a.db.collection('recoDaily').orderBy(firebase.firestore.FieldPath.documentId()).startAt(start).get();
        a.daily = daily.docs.map(d => ({ id: d.id, ...d.data() }));
        a.dailyError = null;
      } catch (e) {
        a.daily = null;
        a.dailyError = e.code === 'permission-denied' ? 'rules' : e.message;
      }
    }
  } catch (e) {
    a.docs = null;
    a.error = e.code === 'permission-denied' ? 'rules' : e.message;
  }
  if (key === tab) draw();
}

  if (!anyUser) { root.innerHTML = loginHtml(Admin.message); return; }
  const a = APPS[tab];
  const tabs = `<div class="tabs" role="tablist">${Object.entries(APPS).map(([k, x]) => `<button role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}" onclick="Admin.select('${k}')">${x.name}${x.user ? '' : '<span class="state">non connecté</span>'}</button>`).join('')}<button role="tab" aria-selected="${tab === 'site'}" class="${tab === 'site' ? 'on' : ''}" onclick="Admin.select('site')">${SITE.name}</button></div>`;
  let body;
  if (tab === 'site') body = renderSite();
  else if (!a.user) body = `<div class="card"><p class="sub">Pas connecté à ${a.name} : ton compte n'existe pas dans ce projet, ou son mot de passe est différent.</p>${Admin.message ? `<p class="error" style="margin-top:8px;">${esc(Admin.message)}</p>` : ''}<p style="margin-top:12px;"><button onclick="Admin.signOut()">Se déconnecter et réessayer</button></p></div>`;
  else if (a.error === 'rules') body = rulesHtml(tab);
  else if (a.error) body = `<p class="error">Impossible de charger les statistiques : ${esc(a.error)}</p>`;
  else if (!a.docs) { body = '<p class="note">Chargement…</p>'; }
  else { docs = withoutMe(a); body = tab === 'collection' ? renderCollection(docs) : renderRoutine(); }
  root.innerHTML = tabs + body;
}

for (const [key, a] of Object.entries(APPS)) {
  a.auth.onAuthStateChanged(user => {
    a.user = user || null; a.docs = null; a.error = null;
    draw();
    if (user) load(key);
  });
}
</script>
</body>
</html>
